[workspace]
members = [
    "accounting/account",
    "accounting/journal-entry",
    "accounting/ledger",
    "accounting/reporting",
    "foundation/money",
    "foundation/month",
    "simulation/context",
    "simulation/domain-calculations",
    "simulation/random-engine",
    "simulation/slice-catalogue",
    "simulation/slice",
    "simulation/snapshot",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
