[workspace]
members = []
exclude = [
    "crates/domain",
    "crates/accounting",
    "crates/models",
    "crates/randomness",
    "crates/simulation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
