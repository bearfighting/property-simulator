[workspace]
members = [
    "core/accounting/account",
    "core/accounting/journal-entry",
    "core/accounting/ledger",
    "core/accounting/reporting",
    "core/foundation/money",
    "core/foundation/month",
    "core/simulation/domain-calculations",
    "core/simulation/random-engine",
    "core/simulation/stop-condition",
    "core/simulation/slice-catalogue",
    "core/simulation/slice",
]
exclude = [
    "crates/domain",
    "crates/accounting",
    "crates/models",
    "crates/randomness",
    "crates/simulation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
