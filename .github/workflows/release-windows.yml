name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build desktop binary
        run: cargo build --locked --release -p property-simulation-desktop

      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $directory = "dist/property-simulator-$env:RELEASE_TAG-windows-x64"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Copy-Item "target/release/property-simulation-desktop.exe" $directory
          Copy-Item "LICENSE" $directory
          Copy-Item "presentation/gpui/README.md" "$directory/README.md"
          Compress-Archive -Path "$directory/*" -DestinationPath "dist/property-simulator-$env:RELEASE_TAG-windows-x64.zip"

      - name: Publish Windows pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = "dist/property-simulator-$env:RELEASE_TAG-windows-x64.zip"
          gh release create $env:RELEASE_TAG $asset `
            --title "Property Simulator $env:RELEASE_TAG (Windows preview)" `
            --generate-notes `
            --prerelease
